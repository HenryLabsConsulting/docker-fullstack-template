# CI — Stack Smoke Test
# Verifies the template's core promise: `docker compose up` produces a
# working full-stack app. Brings up db + backend + frontend, runs
# migrations and the seeder, then hits the real endpoints a developer
# would hit by hand.

name: CI — Stack Smoke Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  compose-up:
    name: docker compose up + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          echo "Waiting for backend /api/health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Backend never became healthy"
              docker compose logs
              exit 1
            fi
            sleep 1
          done

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend dev server..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "Frontend up after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Frontend never came up"
              docker compose logs
              exit 1
            fi
            sleep 1
          done

      - name: Initialize database
        run: |
          docker compose exec -T backend flask db upgrade
          docker compose exec -T backend python seed.py

      - name: Assert backend health endpoint
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$HTTP" != "200" ]; then
            echo "Expected 200 from /api/health, got $HTTP"
            exit 1
          fi

      - name: Assert frontend root content
        run: |
          BODY=$(curl -sf http://localhost:5173/)
          echo "$BODY" | grep -q '<title>MyApp</title>' || { echo "Frontend root missing expected <title>MyApp</title>"; exit 1; }
          echo "$BODY" | grep -q 'id="root"' || { echo "Frontend root missing #root mount node"; exit 1; }

      - name: Run auth + CRUD smoke test
        run: bash scripts/smoke_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
